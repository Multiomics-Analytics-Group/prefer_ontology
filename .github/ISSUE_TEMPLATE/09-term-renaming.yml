name: Term Renaming
description: Request that an existing term's name/label be changed without altering its meaning
title: "[Label] "
labels: ["term renaming request","triage"]
body:
- type: markdown
  attributes:
    value: "Thank you for your interest in contributing to the ontology! Please fill out the following template to propose a new label for an existing term. If you are unsure about any of the fields, please leave them blank and a curator will follow up with you."
- type: textarea
  attributes:
    label: Term
    description: "The ID and current label of the existing term."
  validations:
    required: true
- type: textarea
  attributes:
    label: Suggested new label
    description: "The proposed replacement label. Note: this should be a rename only — if the meaning of the term itself needs to change, use the Textual/Logical Definition Revision template instead."
  validations:
    required: true
- type: textarea
  attributes:
    label: Supporting evidence
    description: "Any citation (e.g. `PMID:#######`) or other evidence supporting the new label."
  validations:
    required: false
- type: textarea
  attributes:
    label: Motivation
    description: "Explain why the term needs a new label."
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional information
    description: "Anything else relevant to the request that isn't captured above."
  validations:
    required: false
- type: textarea
  attributes:
    label: Contributor
    description: "If you would like to be credited, please provide your ORCID (or similar identifier)."
  validations:
    required: false
- type: markdown
  attributes:
    value: "If you are unsure about any of the fields, please leave them blank and a curator will follow up with you."
- type: markdown
  attributes:
    value: "*References* This template was synthesized from the templates for similar issue types of OBO Foundry (https://obofoundry.org) issue templates. The specific source of each block is specified in the PROVENANCE.md file. All repositories used for inspiration for this template is referenced here: agro/relabel-term.yml, mondo/relabel-term.md, so/update-definition-or-name.md"
