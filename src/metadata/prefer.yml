# PURL configuration for http://purl.obolibrary.org/obo/prefer

idspace: PREFER
base_url: /obo/prefer

products:
- prefer.owl: https://raw.githubusercontent.com/Multiomics-Analytics-Group/prefer_ontology/main/prefer.owl
- prefer.obo: https://raw.githubusercontent.com/Multiomics-Analytics-Group/prefer_ontology/main/prefer.obo

term_browser: ontobee
example_terms:
- PREFER_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/Multiomics-Analytics-Group/prefer_ontology/v

- prefix: /tracker/
  replacement: https://github.com/Multiomics-Analytics-Group/prefer_ontology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/PREFER?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/Multiomics-Analytics-Group/prefer_ontology/main/

