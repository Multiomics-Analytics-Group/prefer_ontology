name: New Term or Class Request
description: Propose that a new term (class) be added to the ontology.
title: "[NTR] "
labels: ["new term request","triage"]
body:
- type: markdown
  attributes:
    value: |
      Thank you for your interest in contributing to the ontology! Please fill out the
      following template to propose a new term or class. If you are unsure about any
      of the fields, please leave them blank and a curator will follow up with you.
- type: checkboxes
  attributes:
  label: Does the term already exist?
  description: Please check OLS (https://www.ebi.ac.uk/ols4/ontologies/omo) to see if the term already exists.
  options:
    - label: Term does not exist and I have checked OLS (https://www.ebi.ac.uk/ols4/ontologies/omo).
      required: false
    - label: Term does exist, but in another ontology than PREFER.
      required: false
- type: textarea
  attributes:
    label: Proposed term label
    description: |
      If you have checked OLS and the term already exists in another ontology, please
      provide the ontology name and ID of the existing term here. If you are unsure,
      leave this blank and a curator will follow up with you.
  validations:
    required: false
- type: textarea
  attributes:
    label: Synonyms
    description: Any alternative names for the concept. Please indicate the scope of each synonym (exact / broad / narrow / related) where possible.
  validations:
    required: false
- type: textarea
  attributes:
    label: Definition
    description: A clear, referenced definition, written so it is understandable to non-specialists. Please include a citation (e.g. `PMID:#######` or a DOI) supporting the definition where possible.
  validations:
    required: true
- type: textarea
  attributes:
    label: Example usage
    description: A sentence or two showing how the term is used in context. Please include a citation (e.g. `PMID:#######` or a DOI) supporting the example where possible.
  validations:
    required: false
- type: textarea
  attributes:
    label: Suggested parent term(s)
    description: Where should this term sit in the ontology's hierarchy? Please give the ID and label of the proposed parent term(s), if known.
  validations:
    required: false
- type: textarea
  attributes:
    label: Suggested child term(s) (optional)
    description: If you know of any terms that should be classified as children under this new term, please provide their IDs and labels here.
  validations:
    required: false
- type: textarea
  attributes:
    label: Existing terms affected
    description: If you know of any terms that should be classified as siblings or having other relation to this new term, please provide their IDs, labels and/or other relations here.
  validations:
    required: false
- type: textarea
  attributes:
    label: References
    description: Any references (e.g. publications, datasets, etc.), identifiers or links in other databases/ontologies (e.g. equivalent or related entries elsewhere) that support this request.
  validations:
    required: false
- type: textarea
  attributes:
    label: Motivation
    description: Explain why this new term or class should be added. If a similar term or class already exists elsewhere, explain why it should not simply be re-used/imported instead.
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional information (optional)
    description: Anything else relevant to the request that isn't captured above.
  validations:
    required: false
- type: textarea
  attributes:
    label: Contributor
    description: If you would like to be credited, please provide your ORCID (or similar identifier).
  validations:
    required: false
- type: markdown
  attributes:
    value: |
      Thank you for taking the time to fill out this template! A curator will review your
      request and follow up with you if any additional information is needed. You can
      track the status of your request by checking back on this issue.
      This template was synthesized from the templates for similar issue types of OBO Foundry (https://obofoundry.org) issue templates. The specific source of each block is specified in the PROVENANCE.md file. All repositories used for inspiration for this template is referenced here:
      
      agro/add-term.yml, agro/import-term.yml, cl/a_adding_term.md, cl/a_adding_term_cellxgene.md, fbbi/a_adding_term.md, foodon/new-term-request--ntr-.md, fypo/new-term-request.md, go/metabolic-biosynthetic-catalytic-process---new-term-request.md, go/new-term-request.md, go/ntr--protein-containing-complex.md, mondo/add-gene-related-syndrome.md, mondo/add-term.yml, ms/new_term.yaml, pbpko/add-term.md, so/new-term-request.md, uberon/a_adding_term.md

