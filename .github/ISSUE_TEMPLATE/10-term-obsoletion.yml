---
name: Term Obsoletion
about: Request that an existing term be deprecated/obsoleted
title: "[Obsolete] "
labels: obsoletion
---

## Term to obsolete
The ID and label of the existing term.

## Reason for deprecation
Why should this term be obsoleted (e.g. it is unclear, a duplicate, was
added in error, or is superseded by other terms)?

## Suggested replacement / term(s) to consider (optional)
The ID and label of a term that could replace this one, or that users of
this term should consider instead. Note: if there is one clear, direct
replacement, consider using the Term Merge template instead.

## Additional information (optional)
Anything else relevant to the request that isn't captured above.

## Contributor
If you would like to be credited, please provide your ORCID (or similar
identifier).

