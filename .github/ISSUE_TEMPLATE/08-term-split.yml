name: Term Split
description: Request that an existing term be split into two or more new terms
title: "[Split] "
labels: ["term split request","triage"]
body:
- type: textarea
  attributes:
    label: Term to split
    description: "The ID and label of the existing term that should be split."
  validations:
    required: true
- type: textarea
  attributes:
    label: Proposed new terms
    description: "List the labels of the two or more new terms that should replace the original term."
  validations:
    required: true
- type: textarea
  attributes:
    label: Properties to move to each new term
    description: "Note which existing properties (synonyms, definitions, cross-references, etc.) should move to which new term. Properties not mentioned typically stay with the more generic of the new terms."
  validations:
    required: false
- type: textarea
  attributes:
    label: Motivation
    description: "Explain why the term should be split. If a similar term already exists elsewhere, explain why it should not simply be re-used/imported instead."
  validations:
    required: true
- type: textarea
  attributes:
    label: Example(s) of use
    description: "Provide at least one example showing the proposed new terms in use."
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional information
    description: "Anything else relevant to the request that isn't captured above."
  validations:
    required: false
- type: textarea
  attributes:
    label: Contributor
    description: "If you would like to be credited, please provide your ORCID (or similar identifier)."
  validations:
    required: false 
- type: markdown
  attributes:
    value: "Thank you for your interest in contributing to the ontology! Please fill out the above template to propose a term split. If you are unsure about any of the fields, please leave them blank and a curator will follow up with you."
- type: markdown
  attributes:
    value: "*References* This template was synthesized from the templates for similar issue types of OBO Foundry (https://obofoundry.org) issue templates. The specific source of each block is specified in the PROVENANCE.md file (link). All repositories used for inspiration for this template is referenced here: agro/split-term.yml, mondo/split-term.md"