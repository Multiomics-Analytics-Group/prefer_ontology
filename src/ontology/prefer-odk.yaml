id: prefer
title: "PREFER Ontology"
github_org: Multiomics-Analytics-Group
git_main_branch: main
repo: prefer_ontology
release_artefacts:
  - base
  - full
primary_release: full
export_formats:
  - owl
  - obo
  - json
#sssom_mappingset_group:
#  products:
#    - id: prefer-external
#      maintainance: manual
components:
  products:
      - filename: foundation.owl
      - filename: units.owl
        use_template: True
        templates:
          - units.tsv
import_group:
  use_base_merging: TRUE
  products:
    - id: iao
    - id: cl
      use_base: TRUE
    - id: omo
      make_base: TRUE
    - id: ro
      use_base: TRUE
    - id: chebi
      mirror_from: https://github.com/obophenotype/chebi_obo_slim/releases/latest/download/chebi_slim.owl
    - id: pato
      use_base: TRUE
    - id: go
      use_base: TRUE
    - id: obi
      use_base: TRUE
    - id: uberon
      use_base: TRUE
    - id: cob
      use_base: TRUE
    - id: ncbitaxon
      mirror_from: http://purl.obolibrary.org/obo/ncbitaxon/subsets/taxslim.owl
    - id: sio
      make_base: TRUE
      mirror_from: http://semanticscience.org/ontology/sio.owl 
      base_iris:
        - http://semanticscience.org/resource/SIO_
robot_java_args: "-Xmx16G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit