id: prefer
title: "PREFER Ontology"
github_org: Multiomics-Analytics-Group
git_main_branch: main
repo: prefer_ontology
release_artefacts:
  - base
  - full
primary_release: full
export_formats:
  - owl
  - obo
  - json
sssom_mappingset_group:
  products:
    - id: prefer-external
      maintainance: manual
components:
  products:
      - filename: foundation.owl
import_group:
  use_base_merging: TRUE
  products:
    - id: iao
    - id: cl
      use_base: TRUE
    - id: omo
    - id: ro
      use_base: TRUE
    - id: chebi
      mirror_from: https://raw.githubusercontent.com/obophenotype/chebi_obo_slim/refs/heads/main/chebi_slim.owl
      is_large: TRUE
    - id: bao
      mirror_from: http://www.bioassayontology.org/bao/bao_complete.owl
      make_base: TRUE
      base_irirs:
        - http://www.bioassayontology.org/
    - id: uo
      make_base: TRUE
    - id: pato
      use_base: TRUE
    - id: sio
      mirror_from: http://semanticscience.org/ontology/sio.owl
      make_base: TRUE
      base_iris:
        - http://semanticscience.org/resource/SIO_
    - id: go
      use_base: TRUE
robot_java_args: "-Xmx16G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit