name: Hierarchy Revision
description: Request a change to where a term sits in the is-a/parent-child hierarchy, or add/revise a relationship between terms
title: "[Hierarchy] "
labels: ["class hierarchy revision","triage"]
body:
- type: textarea
  attributes:
    label: Term
    description: "The ID and label of the term(s) whose position or relationships should change."
  validations:
    required: true
- type: textarea
  attributes:
    label: Current parent term
    description: "The ID and label of the term's current parent, if relevant."
  validations:
    required: false
- type: textarea
  attributes:
    label: Suggested change
    description: "Describe the suggested revision: e.g. a new/additional superclass (parent) term, a different parent to move the term under, or a new relationship (and its type) to add between two terms."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reason for the change
    description: "Why should this revision be made?"
  validations:
    required: true
- type: textarea
  attributes:
    label: Supporting reference(s)
    description: "Any citation (e.g. `PMID:#######`) supporting the change."
  validations:
    required: false
- type: textarea
  attributes:
    label: Additional information
    description: "Anything else relevant to the request that isn't captured above."
  validations:
    required: false
- type: textarea
  attributes:
    label: Contributor
    description: "If you would like to be credited, please provide your ORCID (or similar identifier)."
  validations:
    required: false 
- type: markdown
  attributes:
    value: "If you are unsure about any of the fields, please leave them blank and a curator will follow up with you."
- type: markdown
  attributes:
    value: "*References* This template was synthesized from the templates for similar issue types of OBO Foundry (https://obofoundry.org) issue templates. The specific source of each block is specified in the PROVENANCE.md file. All repositories used for inspiration for this template is referenced here: cl/d_revise_subclass.md, fypo/missing-superclass.md, go/missing-superclass.md, mondo/revise-subclass-relationship.md, pbpko/revise-subclass-relationship.md, so/move-term.md, uberon/d_revise_subclass.md "