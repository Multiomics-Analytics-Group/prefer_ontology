## Term to split
The ID and label of the existing term that should be split.

## Proposed new terms
List the labels of the two or more new terms that should replace the
original term.

## Properties to move to each new term (optional)
Note which existing properties (synonyms, definitions, cross-references,
etc.) should move to which new term. Properties not mentioned typically stay
with the more generic of the new terms.

## Additional information (optional)
Anything else relevant to the request that isn't captured above.

## Contributor
If you would like to be credited, please provide your ORCID (or similar
identifier).

