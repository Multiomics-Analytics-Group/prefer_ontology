name: New Property Request
about: Propose that a new property (relation) be added to the ontology
title: "Request for adding property [NAME]"
labels: ["new property request","triage"]
body:
- type: markdown
  attributes:
    value: "Thank you for your interest in contributing to the ontology! Please fill out the following template to propose a new property. If you are unsure about any of the fields, please leave them blank and a curator will follow up with you."
- type: textarea
  attributes:
    label: IRI
    description: "If the property already exists elsewhere, provide its full IRI here."
  validations:
    required: false
- type: textarea
  attributes:
    label: Proposed property label
    description: "What should be the canonical label of the property?"
  validations:
    required: false
- type: textarea
  attributes:
    label: Definition
    description: "A clear, referenced definition, written so it is understandable to non-specialists. Please include a citation (e.g. `PMID:#######` or a DOI) supporting the definition where possible."
  validations:
    required: true
- type: textarea
  attributes:
    label: Example(s) of use
    description: "Provide at least one example showing the property in use."
  validations:
    required: true
- type: textarea
  attributes:
    label: Parent property
    description: "If there is a suitable parent property already in the ontology, provide its ID and label here."
  validations:
    required: false
- type: textarea
  attributes:
    label: Range / datatype
    description: "What kind of value does this property take (e.g. string, integer, a class, an individual, another property, a URI)?"
  validations:
    required: true
- type: textarea
  attributes:
    label: Motivation
    description: "Explain why this property should be added. If a similar property already exists elsewhere, explain why it should not simply be re-used/imported instead."
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional information
    description: "Anything else relevant to the request that isn't captured above."
  validations:
    required: false
- type: textarea
  attributes:
    label: Contributor
    description: "If you would like to be credited, please provide your ORCID (or similar identifier)."
  validations:
    required: false
- type: markdown
  attributes:
    value: Thank you for taking the time to fill out this template! A curator will review your request and follow up with you if any additional information is needed.
- type: markdown
  attributes:
    value: This template was synthesized from the templates for similar issue types of OBO Foundry (https://obofoundry.org) issue templates. The specific source of each block is specified in the PROVENANCE.md file (link). All repositories used for inspiration for this template is referenced here: omo/new_property.yml (OBO Metadata Ontology)
